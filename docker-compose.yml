version: '3.8'

services:
  aether-orbit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether_orbit_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - N2YO_API_KEY=${N2YO_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
